<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" fill="none">
  <defs>
    <linearGradient id="combo-metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c7ccd1"/>
      <stop offset="45%" stop-color="#f2f4f6"/>
      <stop offset="55%" stop-color="#e2e5e8"/>
      <stop offset="100%" stop-color="#aab0b6"/>
    </linearGradient>
    <linearGradient id="combo-metal-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9ecef"/>
      <stop offset="100%" stop-color="#b7bcc1"/>
    </linearGradient>
  </defs>

  <!-- Sauvignon Blanc (left, back) -->
  <g transform="translate(190,430) rotate(-14)">
    <rect x="-100" y="0" width="200" height="72" rx="22" fill="url(#combo-metal)"/>
    <ellipse cx="0" cy="6" rx="92" ry="9" fill="url(#combo-metal-top)"/>
    <ellipse cx="0" cy="34" rx="16" ry="9" fill="#c9ced3" stroke="#9aa1a8" stroke-width="2"/>
    <rect x="-100" y="58" width="200" height="440" rx="22" fill="#3CAA44"/>
    <rect x="-100" y="474" width="200" height="24" rx="12" fill="url(#combo-metal)" opacity="0.95"/>
    <rect x="42" y="70" width="16" height="380" rx="8" fill="#ffffff" opacity="0.16"/>
  </g>

  <!-- Zinfandel (right, back) -->
  <g transform="translate(710,430) rotate(14)">
    <rect x="-100" y="0" width="200" height="72" rx="22" fill="url(#combo-metal)"/>
    <ellipse cx="0" cy="6" rx="92" ry="9" fill="url(#combo-metal-top)"/>
    <ellipse cx="0" cy="34" rx="16" ry="9" fill="#c9ced3" stroke="#9aa1a8" stroke-width="2"/>
    <rect x="-100" y="58" width="200" height="440" rx="22" fill="#9C2A4C"/>
    <rect x="-100" y="474" width="200" height="24" rx="12" fill="url(#combo-metal)" opacity="0.95"/>
    <rect x="42" y="70" width="16" height="380" rx="8" fill="#ffffff" opacity="0.16"/>
  </g>

  <!-- Petite Sirah (center, front) -->
  <g transform="translate(450,370)">
    <rect x="-104" y="0" width="208" height="76" rx="24" fill="url(#combo-metal)"/>
    <ellipse cx="0" cy="6" rx="96" ry="10" fill="url(#combo-metal-top)"/>
    <ellipse cx="0" cy="36" rx="17" ry="10" fill="#c9ced3" stroke="#9aa1a8" stroke-width="2"/>
    <rect x="-104" y="62" width="208" height="458" rx="24" fill="#A71E22"/>
    <rect x="-104" y="480" width="208" height="26" rx="13" fill="url(#combo-metal)" opacity="0.95"/>
    <rect x="44" y="74" width="17" height="400" rx="8.5" fill="#ffffff" opacity="0.18"/>
  </g>
</svg>
